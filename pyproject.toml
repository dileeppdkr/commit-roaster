[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "commit-roaster"
version = "0.2.0"
description = "A grumpy senior dev in your terminal: roasts your git diff, then writes the commit message."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dileeppdkr" }]
keywords = ["git", "commit", "cli", "claude", "llm"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
dependencies = [
    "anthropic>=2.9,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff==0.17.5",  # keep in sync with the ruff-pre-commit rev in .pre-commit-config.yaml
]

[project.urls]
Homepage = "https://github.com/dileeppdkr/commit-roaster"
Issues = "https://github.com/dileeppdkr/commit-roaster/issues"

[project.scripts]
roast = "commit_roaster.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
commit_roaster = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "N",    # pep8 naming
    "S",    # bandit (security)
    "PT",   # pytest style
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# The git module shells out to git on purpose, always with an argument list (never a shell).
"src/commit_roaster/git.py" = ["S603"]
"tests/**" = ["S101", "S603", "S607"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=commit_roaster --cov-report=term-missing"

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
